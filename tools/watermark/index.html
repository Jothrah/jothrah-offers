<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>علامة جذرة المائية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--dk:#0b2e1f;--dk2:#173f2e;--gd:#e2b64c;--bg:#f5f8f6;--ln:#e3ece6;--mu:#5f7a6c}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--dk);font:16px/1.6 "IBM Plex Sans Arabic",system-ui,-apple-system,Tahoma,sans-serif}
header{background:var(--dk);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px}
.hd{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.lg{width:42px;height:42px;border-radius:14px;background:var(--gd);color:var(--dk);display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
header b{display:block;font-size:18px}header small{color:#b9cfc3;font-size:13.5px}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:16px}
.stage{position:sticky;top:12px}
.pv{aspect-ratio:1/1;border-radius:14px;background:repeating-conic-gradient(#eef3f0 0 25%,#fff 0 50%) 0 0/24px 24px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--ln)}
.pv canvas{max-width:100%;max-height:100%;display:block}
.pv .empty{color:var(--mu);text-align:center;padding:20px;font-size:15px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed #c8d8ce;border-radius:16px;padding:22px 14px;text-align:center;cursor:pointer;background:#fafcfb}
.drop.on{border-color:var(--gd);background:#fffaf0}
.drop b{font-size:16px}.drop small{color:var(--mu);font-size:13.5px}
h2{font-size:16px;margin:16px 0 8px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg button{font:inherit;font-size:13.5px;font-weight:700;border:1px solid #d6e3db;background:#fff;color:var(--dk);border-radius:12px;min-height:44px;padding:6px 4px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--dk);color:#fff;border-color:var(--dk)}
label.rng{display:grid;grid-template-columns:7.5em minmax(0,1fr) 3.2em;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:10px 0}
label.rng output{text-align:left;font-variant-numeric:tabular-nums;color:var(--mu)}
input[type=range]{width:100%;accent-color:var(--dk);height:28px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:10px 0;min-height:32px}
.chk input{width:20px;height:20px;accent-color:var(--dk)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:12px;min-height:48px;padding:0 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.pri{background:var(--gd);color:var(--dk);flex:1}
.sec{background:#fff;color:var(--dk);border:1px solid #d6e3db}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.seg button:focus-visible,.drop:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:12px}
.it{position:relative;border:2px solid var(--ln);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;padding:0}
.it[aria-current=true]{border-color:var(--gd)}
.it img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;background:#fff}
.it span{position:absolute;inset:auto 0 0 0;background:rgba(11,46,31,.82);color:#fff;font-size:11.5px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it a{position:absolute;top:4px;left:4px;width:30px;height:30px;border-radius:9px;background:var(--gd);display:grid;place-items:center}
.note{font-size:13.5px;color:var(--mu);margin:10px 0 0;line-height:1.7}
.logo-pv{display:flex;align-items:center;gap:10px;border:1px solid var(--ln);border-radius:12px;padding:8px 10px;background:#fafcfb}
.logo-pv img{height:34px;max-width:160px;object-fit:contain}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--dk);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;z-index:9;max-width:calc(100% - 32px);text-align:center}
.hide{display:none!important}
@media(max-width:820px){main{grid-template-columns:minmax(0,1fr)}.stage{position:static}}
</style>
</head>
<body>
<header><div class="hd"><div class="lg" aria-hidden="true">ج</div><div><b>علامة جذرة المائية</b><small>اختر الصور، ينحط الشعار عليها تلقائياً، ونزّلها جاهزة لسلة</small></div></div></header>
<main>
  <section class="stage card" aria-label="المعاينة">
    <div class="pv" id="pv"><div class="empty" id="empty">المعاينة تظهر هنا بعد ما تختار الصور</div><canvas id="cv" class="hide"></canvas></div>
    <div class="list" id="list"></div>
  </section>

  <section class="card" aria-label="الإعدادات">
    <label class="drop" id="drop" tabindex="0">
      <b>اختر صور المنتجات</b>
      <small>تقدر تختار أكثر من صورة مرة وحدة، أو تسحبها هنا</small>
      <input id="files" type="file" accept="image/*" multiple class="hide">
    </label>

    <h2>مكان الشعار</h2>
    <div class="seg" id="pos" role="group" aria-label="مكان الشعار">
      <button type="button" data-v="center">الوسط</button>
      <button type="button" data-v="br">تحت يمين</button>
      <button type="button" data-v="bl">تحت يسار</button>
      <button type="button" data-v="tile">متكرر</button>
    </div>

    <label class="rng">حجم الشعار<input id="size" type="range" min="10" max="80" step="1"><output id="sizeO"></output></label>
    <label class="rng">الشفافية<input id="op" type="range" min="10" max="100" step="1"><output id="opO"></output></label>
    <label class="chk"><input id="sq" type="checkbox"> مربع 2000×2000 بخلفية بيضاء (مقاس صور سلة)</label>

    <h2>الشعار</h2>
    <div class="logo-pv"><img id="logoImg" alt="الشعار المستخدم"><span class="row" style="margin-inline-start:auto">
      <label class="btn sec" style="min-height:40px;font-size:13.5px">تغيير<input id="logoFile" type="file" accept="image/png,image/webp,image/svg+xml" class="hide"></label>
      <button type="button" class="btn sec" id="logoReset" style="min-height:40px;font-size:13.5px">الأصلي</button></span></div>
    <p class="note">استخدم شعار PNG بخلفية شفافة. إعداداتك والشعار ينحفظون في هذا الجهاز للمرة الجاية.</p>

    <div class="row" style="margin-top:16px">
      <button type="button" class="btn pri" id="saveAll" disabled>حفظ كل الصور</button>
      <button type="button" class="btn sec" id="zip" disabled>ملف ZIP</button>
    </div>
    <p class="note" id="hint">الصور ما ترتفع لأي مكان؛ كل الشغل يصير داخل جهازك.</p>
  </section>
</main>
<div class="toast hide" id="toast" role="status"></div>

const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem('jwm_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('jwm_'+k,JSON.stringify(v))}catch(e){}}};
const S={pos:store.get('pos','center'),size:store.get('size',45),op:store.get('op',22),sq:store.get('sq',false),logo:store.get('logo',null)};
let files=[],cur=0,logo=new Image();
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hide'),2800)};

function loadLogo(){return new Promise(r=>{logo=new Image();logo.onload=()=>r();logo.onerror=()=>{S.logo=null;store.set('logo',null);logo.src=DEF_LOGO;r()};logo.src=S.logo||DEF_LOGO;$('logoImg').src=logo.src})}
function syncUI(){
  document.querySelectorAll('#pos button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.pos));
  $('size').value=S.size;$('sizeO').textContent=S.size+'%';
  $('op').value=S.op;$('opO').textContent=S.op+'%';
  $('sq').checked=S.sq;
}
function readImg(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f);const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u})}

/* يرسم الصورة مع الشعار على canvas */
function render(img,cv){
  let W=img.naturalWidth,H=img.naturalHeight,dx=0,dy=0,dw=W,dh=H;
  if(S.sq){const T=2000,sc=Math.min(T*0.9/W,T*0.9/H);dw=Math.round(W*sc);dh=Math.round(H*sc);W=H=T;dx=Math.round((T-dw)/2);dy=Math.round((T-dh)/2)}
  cv.width=W;cv.height=H;const c=cv.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,W,H);
  c.imageSmoothingQuality='high';c.drawImage(img,dx,dy,dw,dh);
  const lw=Math.round(Math.min(W,H)*S.size/100),lh=Math.round(lw*logo.naturalHeight/logo.naturalWidth);
  const m=Math.round(Math.min(W,H)*0.04);
  c.globalAlpha=S.op/100;
  if(S.pos==='tile'){
    c.save();c.translate(W/2,H/2);c.rotate(-Math.PI/7);
    const gx=lw*1.6,gy=lh*3.2,R=Math.hypot(W,H)/2;
    for(let y=-R;y<R;y+=gy)for(let x=-R;x<R;x+=gx)c.drawImage(logo,x+((Math.round(y/gy)%2)?gx/2:0)-lw/2,y-lh/2,lw,lh);
    c.restore();
  }else{
    const x=S.pos==='center'?(W-lw)/2:S.pos==='br'?W-lw-m:m;
    const y=S.pos==='center'?(H-lh)/2:H-lh-m;
    c.drawImage(logo,x,y,lw,lh);
  }
  c.globalAlpha=1;
}
function outName(f){const b=f.name.replace(/\.[^.]+$/,'');return b+'-jothrah.jpg'}
function toBlob(cv){return new Promise(r=>cv.toBlob(r,'image/jpeg',0.92))}

async function preview(){
  if(!files.length){$('cv').classList.add('hide');$('empty').classList.remove('hide');return}
  $('empty').classList.add('hide');$('cv').classList.remove('hide');
  render(files[cur].img,$('cv'));
  document.querySelectorAll('.it').forEach((e,i)=>e.setAttribute('aria-current',i===cur));
}
function drawList(){
  $('list').innerHTML=files.map((f,i)=>'<button type="button" class="it" data-i="'+i+'" aria-label="معاينة الصورة '+(i+1)+'"><img alt="" src="'+f.thumb+'"><span></span></button>').join('');
  document.querySelectorAll('.it').forEach((b,i)=>{b.querySelector('span').textContent=files[i].file.name;b.onclick=()=>{cur=i;preview()}});
  $('saveAll').disabled=$('zip').disabled=!files.length;
  $('saveAll').textContent=files.length>1?'حفظ كل الصور ('+files.length+')':'حفظ الصورة';
}
async function addFiles(list){
  const arr=[...list].filter(f=>/^image\//.test(f.type));
  if(!arr.length)return;
  for(const f of arr){try{const img=await readImg(f);files.push({file:f,img,thumb:img.src})}catch(e){toast('تعذر فتح '+f.name)}}
  cur=files.length-arr.length;drawList();preview();
}

/* حفظ: على الجوال يفتح «حفظ الصور» عبر المشاركة، وإلا تنزيل */
async function makeAll(){const out=[];const cv=document.createElement('canvas');for(const f of files){render(f.img,cv);out.push(new File([await toBlob(cv)],outName(f.file),{type:'image/jpeg'}))}return out}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('saveAll').onclick=async()=>{
  const b=$('saveAll');b.disabled=true;const t=b.textContent;b.textContent='جاري التجهيز…';
  try{
    const out=await makeAll();
    if(navigator.canShare&&navigator.canShare({files:out})){try{await navigator.share({files:out});toast('اختر «حفظ الصور» عشان تنحفظ في الألبوم')}catch(e){}}
    else{for(const f of out){dl(f,f.name);await new Promise(r=>setTimeout(r,350))}toast('تم تنزيل '+out.length+' صورة')}
  }finally{b.disabled=false;b.textContent=t}
};
/* ZIP بدون ضغط (الصور مضغوطة أصلاً) */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return d=>{let c=0xFFFFFFFF;for(let i=0;i<d.length;i++)c=t[(c^d[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}})();
async function zip(list){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  for(const f of list){
    const data=new Uint8Array(await f.arrayBuffer()),name=enc.encode(f.name),crc=CRC(data);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);
    parts.push(h,name,data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    cen.push(c,name);off+=30+name.length+data.length;
  }
  const size=cen.reduce((s,p)=>s+(p.byteLength||p.length),0);
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,list.length,true);e.setUint16(10,list.length,true);e.setUint32(12,size,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,e],{type:'application/zip'});
}
$('zip').onclick=async()=>{const b=$('zip');b.disabled=true;try{dl(await zip(await makeAll()),'jothrah-watermark.zip');toast('تم تجهيز ملف ZIP')}finally{b.disabled=false}};

/* الإعدادات */
document.querySelectorAll('#pos button').forEach(b=>b.onclick=()=>{S.pos=b.dataset.v;store.set('pos',S.pos);syncUI();preview()});
$('size').oninput=e=>{S.size=+e.target.value;store.set('size',S.size);syncUI();preview()};
$('op').oninput=e=>{S.op=+e.target.value;store.set('op',S.op);syncUI();preview()};
$('sq').onchange=e=>{S.sq=e.target.checked;store.set('sq',S.sq);preview()};
$('logoFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{S.logo=r.result;store.set('logo',S.logo);await loadLogo();preview();toast('تم تغيير الشعار')};r.readAsDataURL(f)};
$('logoReset').onclick=async()=>{S.logo=null;store.set('logo',null);await loadLogo();preview()};
$('files').onchange=e=>{addFiles(e.target.files);e.target.value=''};
const dz=$('drop');
dz.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('files').click()}});
['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('on')}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('on')}));
dz.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
syncUI();loadLogo().then(preview);
}
</script>
</body>
